version: 2
updates:
  # Maintain root level npm dependencies (Husky, scripts)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Maintain backend Node.js dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-backend)"

  # Maintain mobile app Flutter/Dart dependencies
  - package-ecosystem: "pub"
    directory: "/mobile_app"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-mobile)"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"

  # Maintain Dockerfile / docker-compose base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-docker)"
