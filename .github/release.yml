name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'

categories:
  - title: 'Features'
    labels:
      - feature
      - feat
  - title: 'Bug Fixes'
    labels:
      - fix
      - bug
  - title: 'Documentation'
    labels:
      - docs
  - title: 'Maintenance'
    labels:
      - chore
      - ci

change-template: '- $TITLE (#$NUMBER)'
no-changes-template: '- No user-facing changes in this release.'

template: |
  ## What Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
