name: Progress Report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/PROJECT_STATUS.md

jobs:
  progress:
    name: Implementation Progress
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate checklist progress
        id: progress
        run: |
          total=$(grep -Eo "- \[[x ]\]" docs/PROJECT_STATUS.md | wc -l | tr -d ' ')
          done=$(grep -Eo "- \[x\]" docs/PROJECT_STATUS.md | wc -l | tr -d ' ')

          if [ "$total" -eq 0 ]; then
            pct=0
          else
            pct=$(( done * 100 / total ))
          fi

          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "done=$done" >> "$GITHUB_OUTPUT"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"

      - name: Publish summary
        run: |
          echo "## Vruttaant Progress" >> "$GITHUB_STEP_SUMMARY"
          echo "- Completed checklist items: **${{ steps.progress.outputs.done }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total checklist items: **${{ steps.progress.outputs.total }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Completion: **${{ steps.progress.outputs.pct }}%**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: docs/PROJECT_STATUS.md" >> "$GITHUB_STEP_SUMMARY"
