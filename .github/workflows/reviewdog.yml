name: Reviewdog

on:
  pull_request:
    paths:
      - 'backend/src/**/*.js'
      - 'backend/eslint.config.js'
      - '.github/workflows/reviewdog.yml'

concurrency:
  group: reviewdog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-eslint:
    name: Backend ESLint Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint with reviewdog
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: none
          filter_mode: added
          tool_name: backend-eslint
          workdir: backend
          eslint_flags: src/