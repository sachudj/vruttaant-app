name: Reviewdog

on:
  pull_request:
    paths:
      - 'backend/src/**/*.js'
      - 'backend/eslint.config.js'
      - 'mobile_app/**/*.dart'
      - 'mobile_app/analysis_options.yaml'
      - 'mobile_app/pubspec.yaml'
      - '.github/workflows/reviewdog.yml'

concurrency:
  group: reviewdog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-eslint:
    name: Backend ESLint Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint with reviewdog
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: none
          filter_mode: added
          tool_name: backend-eslint
          workdir: backend
          eslint_flags: src/

  mobile-analyze:
    name: Flutter Analyze Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Run Flutter analyze with reviewdog
        working-directory: mobile_app
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | reviewdog \
            -name="flutter-analyze" \
            -efm="%f:%l:%c: %m" \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-level=none