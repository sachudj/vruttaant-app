name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static syntax checks
        run: npm run ci:syntax

      - name: API docs parity check
        run: bash ../scripts/check-api-docs.sh

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Backend health smoke
        env:
          PORT: 5000
          MONGODB_URI: ""
        run: npm run ci:health

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage gates
        run: npm run test:coverage -- --runInBand

  backend-security:
    name: Backend Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fail on high/critical)
        run: npm run security:audit

  mobile:
    name: Mobile Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run JVM Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Mobile size analysis build
        env:
          TARGET_PLATFORM: android-arm64
          MAX_APK_SIZE_MB: 20
        run: bash ../scripts/check-mobile-bundle-size.sh

      - name: Mobile APK trend gate
        env:
          TARGET_PLATFORM: android-arm64
          MAX_APK_GROWTH_PERCENT: 4
        run: bash ../scripts/check-mobile-size-trend.sh

      - name: Collect mobile size artifacts
        run: |
          mkdir -p ../artifacts/mobile-size
          cp -R app/build/size-analysis/. ../artifacts/mobile-size/
          cp app/build/outputs/apk/release/*.apk ../artifacts/mobile-size/

      - name: Upload mobile size artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-size-analysis-android-arm64
          path: artifacts/mobile-size/
          if-no-files-found: error
