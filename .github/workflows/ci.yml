name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static syntax checks
        run: npm run ci:syntax

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Backend health smoke
        env:
          PORT: 5000
          MONGODB_URI: ""
        run: npm run ci:health

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage gates
        run: npm run test:coverage -- --runInBand

  backend-security:
    name: Backend Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fail on high/critical)
        run: npm run security:audit

  mobile:
    name: Mobile Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Widget tests with coverage
        run: flutter test --coverage -r compact

      - name: Mobile size analysis build
        env:
          TARGET_PLATFORM: android-arm64
          MAX_APK_SIZE_MB: 20
        run: ../scripts/check-mobile-bundle-size.sh

      - name: Collect mobile size artifacts
        run: |
          mkdir -p ../artifacts/mobile-size
          cp -R build/size-analysis/. ../artifacts/mobile-size/
          cp build/app/outputs/flutter-apk/*.apk ../artifacts/mobile-size/

      - name: Upload mobile size artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-size-analysis-android-arm64
          path: artifacts/mobile-size/
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: mobile_app/coverage/lcov.info
          flags: mobile
          name: vruttaant-mobile
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
