name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static syntax checks
        run: |
          node --check src/index.js
          node --check src/config/database.js
          node --check src/controllers/authController.js
          node --check src/controllers/newsController.js
          node --check src/models/RefreshToken.js
          node --check src/models/NewsCard.js
          node --check src/models/User.js
          node --check src/routes/newsRoutes.js
          node --check src/routes/authRoutes.js
          node --check src/services/newsIngestionService.js
           node --check src/routes/apiRouter.js
           node --check src/middleware/errorHandler.js
           node --check src/middleware/requestValidation.js
          node --check src/validation/authValidators.js

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Start backend
        env:
          PORT: 5000
          MONGODB_URI: ""
        run: |
          npm start > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:5000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to become healthy"
          cat /tmp/backend.log || true
          exit 1

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill "$(cat /tmp/backend.pid)" || true
          fi

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --verbose

  mobile:
    name: Mobile Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Widget tests with coverage
        run: flutter test --coverage -r compact

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: mobile_app/coverage/lcov.info
          flags: mobile
          name: vruttaant-mobile
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
