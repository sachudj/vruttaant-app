name: Deployment Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gate:
    name: Smoke and SLO Gate
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
          MONGO_INITDB_DATABASE: vruttaant
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run smoke checks
        env:
          NODE_ENV: staging
          MONGODB_URI: mongodb://admin:admin123@127.0.0.1:27017/vruttaant?authSource=admin
          CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
        run: bash scripts/run-smoke-auto.sh

      - name: Start backend for strict load gate
        env:
          NODE_ENV: staging
          PORT: 5001
          MONGODB_URI: mongodb://admin:admin123@127.0.0.1:27017/vruttaant?authSource=admin
          CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
        run: |
          cd backend
          npm start > /tmp/backend-load-gate.log 2>&1 &
          echo $! > /tmp/backend-load-gate.pid

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5001/ready > /tmp/load-gate-ready.json; then
              cat /tmp/load-gate-ready.json
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed readiness for load gate"
          cat /tmp/backend-load-gate.log || true
          exit 1

      - name: Create admin token for load report ingestion
        working-directory: backend
        env:
          NODE_ENV: staging
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          MONGODB_URI: mongodb://admin:admin123@127.0.0.1:27017/vruttaant?authSource=admin
        run: |
          ADMIN_EMAIL="ci-admin@vruttaant.local"
          ADMIN_PASSWORD="ci-admin-password"

          curl -sS -X POST http://127.0.0.1:5001/api/v1/auth/signup \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PASSWORD}\"}" > /tmp/ci-admin-signup.json

          ADMIN_EMAIL="$ADMIN_EMAIL" node -e "
            const mongoose = require('mongoose');
            const User = require('./src/models/User');
            (async () => {
              await mongoose.connect(process.env.MONGODB_URI);
              await User.updateOne({ email: process.env.ADMIN_EMAIL }, { $set: { role: 'admin' } });
              await mongoose.disconnect();
            })().catch((error) => {
              console.error(error);
              process.exit(1);
            });
          "

          LOGIN_RESPONSE="$(curl -sS -X POST http://127.0.0.1:5001/api/v1/auth/login -H 'Content-Type: application/json' -d "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PASSWORD}\"}")"
          TOKEN="$(node -e "const payload = JSON.parse(process.argv[1]); process.stdout.write(payload.data.tokens.accessToken);" "$LOGIN_RESPONSE")"

          if [ -z "$TOKEN" ]; then
            echo "Failed to resolve admin access token"
            echo "$LOGIN_RESPONSE"
            exit 1
          fi

          echo "LOADTEST_REPORT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run strict SLO load baseline
        working-directory: backend
        env:
          NODE_ENV: staging
          MONGODB_URI: mongodb://admin:admin123@127.0.0.1:27017/vruttaant?authSource=admin
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          LOADTEST_BASE_URL: http://127.0.0.1:5001
          LOADTEST_DURATION_SECONDS: 20
          LOADTEST_CONNECTIONS: 4
          LOADTEST_OVERALL_RATE: 3
          LOADTEST_STRICT_SLO: true
          LOADTEST_ENVIRONMENT: staging
          LOADTEST_SOURCE: ci
          LOADTEST_REPORT_ENDPOINT: http://127.0.0.1:5001/api/v1/admin/loadtest/runs
          LOADTEST_REPORT_TOKEN: ${{ env.LOADTEST_REPORT_TOKEN }}
          APP_VERSION: ${{ github.sha }}
        run: npm run loadtest:baseline

      - name: Upload load-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-results-staging
          path: backend/loadtest-results/
          if-no-files-found: warn

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend-load-gate.pid ]; then
            kill "$(cat /tmp/backend-load-gate.pid)" || true
          fi
