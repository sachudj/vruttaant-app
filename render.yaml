services:
  - type: web
    name: vruttaant-backend-test
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: APP_VERSION
        value: render-test
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 200
      - key: JSON_PAYLOAD_LIMIT
        value: 10kb
      - key: RESPONSE_COMPRESSION_THRESHOLD_BYTES
        value: 1536
      - key: CACHE_TTL_NEWS_CARDS
        value: 180
      - key: CACHE_TTL_RECOMMENDED
        value: 90
      - key: CACHE_TTL_ANALYTICS
        value: 300
      - key: IMAGE_CDN_BASE_URL
        sync: false
      - key: IMAGE_CDN_URL_TEMPLATE
        sync: false
      - key: IMAGE_CDN_DEFAULT_WIDTH
        value: 1200
      - key: IMAGE_CDN_DEFAULT_QUALITY
        value: 80
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: APPLE_SERVICE_ID
        sync: false
      - key: SOCIAL_AUTH_AUTO_LINK_BY_EMAIL
        value: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: LLM_MODEL
        value: gpt-4o-mini
